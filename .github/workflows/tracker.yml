name: AnnalsChallenge tracker

on:
  schedule:
    # Offset off the hour: GitHub delays scheduled runs most at :00.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Announce new solves
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_CHANNEL: ${{ secrets.ZULIP_CHANNEL }}
          ZULIP_TOPIC: ${{ secrets.ZULIP_TOPIC }}
          # Optional second destination; unset means post to the first only.
          ZULIP_CHANNEL_2: ${{ secrets.ZULIP_CHANNEL_2 }}
          ZULIP_TOPIC_2: ${{ secrets.ZULIP_TOPIC_2 }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ANNALS_WORKDIR: ${{ github.workspace }}
        run: python3 annals_zulip.py

      - name: Persist announcement state
        # Runs even when the tracker fails: an unreadable-upstream alert
        # records itself in state.json so it isn't re-posted every 5 minutes.
        if: always()
        run: |
          git config user.name annals-tracker
          git config user.email annals-tracker@users.noreply.github.com
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: record announced solves or alerts"
          elif [ $(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 )) -ge 30 ]; then
            # A public repo's scheduled workflows are disabled after 60 quiet
            # days. Solves are sparse, so keep the clock from running out.
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
          else
            exit 0
          fi
          git pull --rebase
          git push
